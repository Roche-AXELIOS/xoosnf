name: kmc_kmer_count
description: Downsample FASTQ reads and count k-mers with KMC to build a personalized graph k-mer set.
keywords:
  - kmc
  - kmer
  - fastq
  - graph
tools:
  - kmc:
      description: Disk-based k-mer counter for genomic data.
      homepage: "https://github.com/refresh-bio/KMC"
      documentation: "https://github.com/refresh-bio/KMC"
      doi: 10.1093/bioinformatics/btx304
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - fastqs:
        type: file
        description: Input FASTQ read files
        ontologies: []
output:
  kff:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_personalized_graph.kff":
          type: file
          description: "Output file matching `*_personalized_graph.kff`"
          pattern: "*_personalized_graph.kff"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kmc:
          type: string
          description: The name of the tool
      - "kmc -v 2>&1 | head -n 1 | grep -oE '[0-9]+([.][0-9]+)+' | head -1":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kmc:
          type: string
          description: The name of the tool
      - "kmc -v 2>&1 | head -n 1 | grep -oE '[0-9]+([.][0-9]+)+' | head -1":
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
