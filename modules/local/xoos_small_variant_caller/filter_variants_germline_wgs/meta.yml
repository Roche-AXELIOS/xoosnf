name: xoos_small_variant_caller_filter_variants_germline_wgs
description: Filter germline WGS variants using trained XOOS small variant caller models.
keywords:
  - small-variant-caller
  - filter
  - germline
  - wgs
tools:
  - filter_variants:
      description: XOOS small variant caller component.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Public License"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bams:
        type: file
        description: BAM alignment files
        ontologies: []
    - bam_indexes:
        type: file
        description: BAM index files
        ontologies: []
    - vcf:
        type: file
        description: VCF variant file
        ontologies: []
    - vcf_index:
        type: file
        description: VCF index file
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reference:
        type: file
        description: Reference FASTA file
        ontologies: []
    - reference_index:
        type: file
        description: Reference FASTA index file
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - model_snv:
        type: file
        description: Trained SNV model file
        ontologies: []
    - model_indel:
        type: file
        description: Trained indel model file
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - popaf:
        type: file
        description: Population allele frequency track
        ontologies: []
    - popaf_index:
        type: file
        description: Population allele frequency index
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - par_bed_x:
        type: file
        description: PAR regions BED for chromosome X
        ontologies: []
    - par_bed_y:
        type: file
        description: PAR regions BED for chromosome Y
        ontologies: []
  - - meta6:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - target_regions_bed:
        type: file
        description: Target regions BED file
        ontologies: []
  - aligner:
      type: string
      description: Aligner name
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "small_variant_caller/*_svc.vcf.gz":
          type: file
          description: "Output file matching `small_variant_caller/*_svc.vcf.gz`"
          pattern: "small_variant_caller/*_svc.vcf.gz"
          ontologies: []
      - "small_variant_caller/*_svc.vcf.gz.tbi":
          type: file
          description: "Output file matching `small_variant_caller/*_svc.vcf.gz.tbi`"
          pattern: "small_variant_caller/*_svc.vcf.gz.tbi"
          ontologies: []
  metrics:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "small_variant_caller/*_svc_metrics.tsv":
          type: file
          description: "Output file matching `small_variant_caller/*_svc_metrics.tsv`"
          pattern: "small_variant_caller/*_svc_metrics.tsv"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - filter_variants:
          type: string
          description: The name of the tool
      - filter_variants --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - filter_variants:
          type: string
          description: The name of the tool
      - filter_variants --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
