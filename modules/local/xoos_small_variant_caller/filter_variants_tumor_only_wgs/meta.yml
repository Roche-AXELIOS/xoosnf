name: xoos_small_variant_caller_filter_variants_tumor_only_wgs
description: Filter tumor-only WGS variants with the XOOS small variant caller. The tumor-only-wgs model bundled in the container is used by default; an optional panel of normals VCF can be supplied for PON-based features.
keywords:
  - small-variant-caller
  - filter
  - tumor-only
  - wgs
tools:
  - filter_variants:
      description: XOOS small variant caller component.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Public License"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bams:
        type: file
        description: BAM alignment files
        ontologies: []
    - bam_indexes:
        type: file
        description: BAM index files
        ontologies: []
    - vcf:
        type: file
        description: VCF variant file
        ontologies: []
    - vcf_index:
        type: file
        description: VCF index file
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reference:
        type: file
        description: Reference FASTA file
        ontologies: []
    - reference_index:
        type: file
        description: Reference FASTA index file
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - model:
        type: file
        description: Optional trained tumor-only model file. When omitted the model bundled in the container is used.
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - popaf:
        type: file
        description: Population allele frequency track
        ontologies: []
    - popaf_index:
        type: file
        description: Population allele frequency index
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - pon:
        type: file
        description: Optional indexed panel of normals VCF (produced by generate_pon). When omitted PON features default to 0.
        ontologies: []
    - pon_index:
        type: file
        description: Panel of normals VCF index
        ontologies: []
  - - meta6:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - target_regions_bed:
        type: file
        description: Target regions BED file
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_svc.vcf.gz":
          type: file
          description: "Output file matching `*_svc.vcf.gz`"
          pattern: "*_svc.vcf.gz"
          ontologies: []
      - "*_svc.vcf.gz.tbi":
          type: file
          description: "Output file matching `*_svc.vcf.gz.tbi`"
          pattern: "*_svc.vcf.gz.tbi"
          ontologies: []
  metrics:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_svc_metrics.tsv":
          type: file
          description: "Output file matching `*_svc_metrics.tsv`"
          pattern: "*_svc_metrics.tsv"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - filter_variants:
          type: string
          description: The name of the tool
      - filter_variants --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - filter_variants:
          type: string
          description: The name of the tool
      - filter_variants --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@roche-axelios"
maintainers:
  - "@roche-axelios"
