name: xoos_parse_alignment_metrics
description: "Parse alignment (read, coverage, accuracy) metrics directories into report JSON."
keywords:
  - metrics
  - alignment
  - parse
tools:
  - generate-metrics-report:
      description: XOOS tool that parses and aggregates per-sample metrics into report JSON/TSV.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Executable License Agreement"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - read_metrics_dir:
        type: file
        description: Read metrics directory
        ontologies: []
    - coverage_metrics_dir:
        type: file
        description: Coverage metrics directory
        ontologies: []
    - accuracy_metrics_dir:
        type: file
        description: Accuracy metrics directory
        ontologies: []
  - source:
      type: string
      description: Source/stage label
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.alignment_metrics_*.json":
          type: file
          description: "Output file matching `*.alignment_metrics_*.json`"
          pattern: "*.alignment_metrics_*.json"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
