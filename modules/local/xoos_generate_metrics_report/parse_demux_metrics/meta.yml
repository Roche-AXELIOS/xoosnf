name: xoos_parse_demux_metrics
description: Parse demultiplexing run and sample stats into report JSON.
keywords:
  - metrics
  - demux
  - parse
tools:
  - generate-metrics-report:
      description: XOOS tool that parses and aggregates per-sample metrics into report JSON/TSV.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Executable License Agreement"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - run_stats:
        type: file
        description: Run-level stats file
        ontologies: []
    - sample_stats:
        type: file
        description: Sample-level stats file
        ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "demux_metrics.json":
          type: file
          description: "Output file matching `demux_metrics.json`"
          pattern: "demux_metrics.json"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
