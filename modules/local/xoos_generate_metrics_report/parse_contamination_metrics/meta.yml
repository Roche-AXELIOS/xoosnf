name: xoos_parse_contamination_metrics
description: Parse contamination detection results into report JSON.
keywords:
  - metrics
  - contamination
  - parse
tools:
  - generate-metrics-report:
      description: XOOS tool that parses and aggregates per-sample metrics into report JSON/TSV.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Executable License Agreement"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - results_dir:
        type: file
        description: Results directory
        ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.contamination_detection.json":
          type: file
          description: "Output file matching `*.contamination_detection.json`"
          pattern: "*.contamination_detection.json"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
