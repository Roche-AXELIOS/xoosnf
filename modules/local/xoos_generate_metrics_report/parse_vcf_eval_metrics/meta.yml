name: xoos_parse_vcf_eval_metrics
description: Parse VCF evaluation (vcfeval) metrics into report JSON.
keywords:
  - metrics
  - vcfeval
  - parse
tools:
  - generate-metrics-report:
      description: XOOS tool that parses and aggregates per-sample metrics into report JSON/TSV.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Executable License Agreement"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - type:
        type: string
        description: Metric type label
    - vcf_eval_metrics:
        type: file
        description: VCF evaluation metrics
        ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.vcf_eval_*_*.json":
          type: file
          description: "Output file matching `*.vcf_eval_*_*.json`"
          pattern: "*.vcf_eval_*_*.json"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
