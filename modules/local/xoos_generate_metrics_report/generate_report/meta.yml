name: xoos_generate_report
description: Aggregate per-sample metrics JSON into a combined metrics-report.tsv.
keywords:
  - metrics
  - report
  - tsv
tools:
  - generate-metrics-report:
      description: XOOS tool that parses and aggregates per-sample metrics into report JSON/TSV.
      homepage: "https://github.com/Roche-AXELIOS/XOOS"
      documentation: "https://roche-axelios.gitbook.io/xoos"
      licence: ["XOOS Executable License Agreement"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - metrics:
        type: file
        description: Metrics inputs
        ontologies: []
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "metrics-report.tsv":
          type: file
          description: "Output file matching `metrics-report.tsv`"
          pattern: "metrics-report.tsv"
          ontologies: []
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - generate-metrics-report:
          type: string
          description: The name of the tool
      - generate-metrics-report --version:
          type: eval
          description: The expression to obtain the version of the tool
authors: []
maintainers: []
